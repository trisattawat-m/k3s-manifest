authentik:
  # Generate with: openssl rand -base64 60
  # Do NOT change this after first install (invalidates sessions/cookies)
  secret_key: "CHANGE_ME_generate_with_openssl_rand_base64_60"
  error_reporting:
    enabled: false
  postgresql:
    # Must match postgresql.auth.password below.
    password: "CHANGE_ME_same_value_as_postgresql.auth.password"

# Bundled Bitnami PostgreSQL (workshop-simple; swap for an external DB later if needed).
postgresql:
  enabled: true
  auth:
    password: "CHANGE_ME_same_value_as_authentik.postgresql.password"

server:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "ca-issuer"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - authentik.k3s-workshop.local
    tls:
      - secretName: authentik-tls-secret
        hosts:
          - authentik.k3s-workshop.local
